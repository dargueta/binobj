[tox]
envlist = py311, py312, py313, py314, lint, mypy, format
skip_missing_interpreters = true
setenv =
    PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring

[testenv]
allowlist_externals = poetry
skip_install = true
commands_pre = poetry install
commands = poetry run pytest {posargs:tests}
passenv =
    COV_PYTHON_VERSION
    COV_PLATFORM
    COV_PYTHON_IMPLEMENTATION

[testenv:lint]
allowlist_externals = poetry
skip_install = true
commands_pre = poetry install
commands = poetry run ruff check

[testenv:format]
allowlist_externals = poetry
skip_install = true
commands_pre = poetry install
commands = poetry run ruff format --check

[testenv:mypy]
allowlist_externals = poetry
basepython = python3.13
skip_install = true
commands_pre = poetry install
commands = poetry run mypy binobj
